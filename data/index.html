<!DOCTYPE html>
<html>
  <head>
    <title>ESP IOT DASHBOARD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
      <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <div class="topnav">
      <h1>ESP WEB SERVER SENSOR READINGS</h1>
    </div>
    <div class="content">
      <div class="card-grid">
        <div class="card">
          <p class="card-title">Viscosímetro Couette - Mediciones</p>
          <div class="experiment-controls">
            <button id="start-btn" onclick="startExperiment()">INICIAR EXPERIMENTO</button>
            <button id="stop-btn" onclick="stopExperiment()" disabled>DETENER EXPERIMENTO</button>
            <button id="reset-btn" onclick="resetExperiment()">RESET CONTADORES</button>
          </div>
          <p class="experiment-status">Estado: <span id="status">Detenido</span></p>
          <p>
            <table>
              <tr>
                <th>PARÁMETRO</th>
                <th>VALOR</th>
              </tr>
              <tr>
                <td>Pulsos IR</td>
                <td><span id="ir_pulses"></span></td>
              </tr>
              <tr>
                <td>Velocidad</td>
                <td><span id="rpm"></span> RPM</td>
              </tr>
              <tr>
                <td>Distancia</td>
                <td><span id="distance"></span> <span id="distance_units"></span></td>
              </tr>
              <tr>
                <td>Viscosidad Dinámica</td>
                <td><span id="viscosity"></span> <span id="units"></span></td>
              </tr>
            </table>
          </p>
          <p class="update-time">Last update: <span id="update-time"></span></p>  
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
